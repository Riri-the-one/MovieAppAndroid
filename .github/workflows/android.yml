name: Android validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  firestore:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @firebase/rules-unit-testing@4.0.1 firebase@11.10.0 firebase-tools@14.7.0
      - run: npx firebase emulators:exec --project demo-movies-portfolio --config firebase.test.json --only firestore 'node --test tests/firestore.test.cjs'
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Quiz round regressions
        run: |
          mkdir -p build/quiz-tests
          javac -encoding UTF-8 -d build/quiz-tests app/src/main/java/com/example/movies_app/QuizRound.java tests/QuizRoundTest.java
          java -cp build/quiz-tests com.example.movies_app.QuizRoundTest
      - run: python3 scripts/create-demo-config.py
      - name: Unit tests, lint and debug APK
        run: bash gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: app/build/reports
          if-no-files-found: ignore

